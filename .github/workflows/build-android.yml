name: Build BUS & COACH SIMULATOR AFRICA for Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity Personal license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Follow Docs/ANDROID_BUILD_GUIDE.md."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Build Android APK
        uses: game-ci/unity-builder@v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.23f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: BUS-COACH-SIMULATOR-AFRICA
          versioning: Semantic
          buildMethod: ATP.Editor.AndroidBuildPipeline.BuildAndroid

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BUS-COACH-SIMULATOR-AFRICA-Android-APK
          path: build/Android/**/*.apk
          if-no-files-found: error
          retention-days: 30
